# infer-models.yaml: the models the local AI engine serves, in
# llama-swap's own config format (its "models:" section; see
# https://github.com/mostlygeek/llama-swap/blob/main/docs/config.example.yaml).
# To serve more models without changing this file, list them in
# infer-models.local.yaml (gitignored), in this same format, starting
# with its own "models:" line; host-setup.sh serves the models in both.
# ./add-model.sh --serve adds to it, and --remove takes a model out. Its
# models can't reuse a name from this file; to change one of these
# models, add your version under another name.
#
# host-setup.sh puts its own settings in front of these files, including
# the API key, so neither file ever holds a secret, and each may have
# only the "models:" section. Indent each model's name by two spaces,
# alone on its line, and its settings by four.
#
# Each model has a role, which follows from its cmd. A generalist (a
# ${llama-server} model) can chat; one usually stays loaded, for up to a
# day without requests. A specialist (an ${sd-server} model) makes
# images; it loads beside the generalist only when needed, and unloads
# soon after. At most one of each runs at a time: requesting another
# generalist swaps out the current one, and likewise for specialists.
#
# The macros hold the flags every model needs (listening only on
# 127.0.0.1, on its role's port, the only ones the sandbox allows, with
# no prompt cache):
#   ${llama-server}      llama-server and those flags; start a
#                        generalist's cmd with it, and don't add --host,
#                        --port, --cors-origins, or --api-key after it
#   ${sd-server}         the same for a specialist's sd-server; don't add
#                        -l, --listen-ip, or --listen-port after it
#   ${models-dir}        MODELS_DIR
#   ${proxy}             where llama-swap reaches a generalist; each one
#                        needs "proxy: ${proxy}"
#   ${specialist-proxy}  the same for a specialist; each one needs
#                        "proxy: ${specialist-proxy}"
# Don't give a model its own "macros:" (they'd override these).
# host-setup.sh checks these rules, and that llama-swap accepts the
# result.
#
# Each text model also needs capabilities.context (its context window,
# which must match --ctx-size) and metadata.max_tokens (the most tokens
# one reply may use); vm-setup.sh reads both from the engine to tell pi.
# A specialist instead needs capabilities.out: [image], which keeps it
# out of pi's list, and a ttl (seconds without a request before it
# unloads) of at most 3600.
# One model has metadata.default: true; it's nopi's default.
#
# Sampling: llama-server uses the sampling settings a GGUF file
# recommends (its general.sampling.* metadata) when it has them. Our
# defaults below come from each model card. A key ending in "?" is a
# default: llama-swap sets it only when a request doesn't, so a client
# can still choose its own. setParamsByID also creates a variant under
# another name (an alias) that shares the loaded model, so switching
# between them doesn't reload anything. llama-swap applies setParams
# and then setParamsByID, and a "?" key is skipped once either has set
# it, so a model with variants keeps each variant's defaults in
# setParamsByID, not setParams.
models:
  qwen3.8-27b:
    name: "Qwen3.8-27B Q8_0"
    # --reasoning-budget caps thinking at 8192 tokens (pi's "medium"),
    # then makes the model answer, unless a request sets its own budget
    # (thinking_budget_tokens). Without it, thinking may run until
    # max_tokens, leaving no answer at all. When the budget runs out,
    # llama-server inserts --reasoning-budget-message (the sentence Qwen
    # suggests for this) before ending the thinking, so the model answers
    # from what it's worked out instead of stopping mid-thought.
    cmd: ${llama-server} --model ${models-dir}/Qwen3.8-27B-Q8_0.gguf --ctx-size 262144 --reasoning-budget 8192 --reasoning-budget-message "Considering the limited time by the user, I have to give the solution based on the thinking directly now."
    proxy: ${proxy}
    capabilities:
      context: 262144
    metadata:
      max_tokens: 32768
      default: true
    filters:
      # From the model card (unsloth/Qwen3.8-27B-GGUF). Its GGUF files
      # set only temperature, top_p, and top_k, so llama-server would
      # otherwise use its own min_p of 0.05.
      setParamsByID:
        "${MODEL_ID}":
          temperature?: 1.0
          top_p?: 0.95
          top_k?: 20
          min_p?: 0
          presence_penalty?: 0
          repeat_penalty?: 1.0
        # Without thinking: the card's "instruct (or non-thinking) mode".
        "${MODEL_ID}:instruct":
          temperature?: 0.7
          top_p?: 0.8
          top_k?: 20
          min_p?: 0
          presence_penalty?: 1.5
          repeat_penalty?: 1.0
          chat_template_kwargs:
            enable_thinking: false
  flux2-klein-4b:
    name: "FLUX.2-klein 4B Q8_0 (images)"
    # For /v1/images/generations and /sdapi/v1/txt2img. --cfg-scale 1.0
    # --steps 4 are what stable-diffusion.cpp's docs/flux2.md uses for it.
    # sd-server has no /health, llama-swap's default checkEndpoint. It
    # loads the model before it listens, so /v1/models answers only once
    # the model is ready.
    cmd: ${sd-server} --diffusion-model ${models-dir}/flux2-klein-4b/flux-2-klein-4b-Q8_0.gguf --vae ${models-dir}/flux2-klein-4b/diffusion_pytorch_model.safetensors --llm ${models-dir}/flux2-klein-4b/Qwen3-4B-Q8_0.gguf --cfg-scale 1.0 --steps 4
    proxy: ${specialist-proxy}
    # Unload after 10 minutes without a request: long enough to look at an
    # image and ask for another, and it frees its memory (and closes its
    # unauthenticated port) soon after.
    ttl: 600
    checkEndpoint: /v1/models
    capabilities:
      in: [text]
      out: [image]
  qwen3-0.6b:
    name: "Qwen3-0.6B Q4_0 (tests)"
    cmd: ${llama-server} --model ${models-dir}/Qwen3-0.6B-Q4_0.gguf --ctx-size 32768
    proxy: ${proxy}
    capabilities:
      context: 32768
    metadata:
      max_tokens: 4096
    filters:
      # From the model card (Qwen/Qwen3-0.6B), for thinking mode.
      setParams:
        temperature?: 0.6
        top_p?: 0.95
        top_k?: 20
        min_p?: 0
