# initial-models.yaml: the models a new host starts with, in
# llama-swap's own config format (its "models:" section; see
# https://github.com/mostlygeek/llama-swap/blob/main/docs/config.example.yaml).
# It's used only at the start: when a host has no models.local.yaml,
# ./manage-models.sh init copies this file there, and from then on
# models.local.yaml (gitignored) is that host's whole list. Changing
# this file changes no host's models. ./manage-models.sh changes the
# list (add, remove, default, update), or you can edit it by hand;
# ./manage-models.sh check then checks the rules below, and
# ./install-models.sh has the engine serve the result.
#
# install-models.sh puts its own settings in front of the list,
# including the API key, so the list never holds a secret, and may have
# only the "models:" section. Indent each model's name by two spaces,
# alone on its line, and its settings by four.
#
# Each model lists the files its cmd uses, one per line, as a comment
# right after its name, so llama-swap never sees it:
#   # file: PATH SHA256 LICENSE URL
# PATH is where it goes in MODELS_DIR (the URL's file name, maybe in one
# subdirectory), SHA256 the publisher's SHA-256, which pins the file,
# and URL where to download it. ./manage-models.sh sync downloads each
# file that's missing or whose SHA-256 changed. A file two models share
# is listed in both, the same way.
#
# A file a script in this repo generates on the host, rather than a
# download (a .jinja chat template, written by extract-chat-template.py
# next to its source GGUF), is listed in the same place instead, as
# "# generated: PATH": manage-models.sh never downloads it, so it names
# no SHA-256 or URL, and PATH is a .jinja file in MODELS_DIR or one
# subdirectory. Either way, each model lists exactly the files its cmd
# uses, one per line.
#
# Each model has a role, which follows from its cmd. A generalist (a
# ${llama-server} model) can chat; one usually stays loaded, for up to a
# day without requests. A specialist (an ${sd-server} model) makes
# images; it loads beside the generalist only when needed, and unloads
# soon after. At most one of each runs at a time: requesting another
# generalist swaps out the current one, and likewise for specialists.
#
# The macros hold the flags every model needs (listening only on
# 127.0.0.1, on its role's port, the only ones the sandbox allows, with
# no prompt cache):
#   ${llama-server}      llama-server and those flags; start a
#                        generalist's cmd with it, and don't add --host,
#                        --port, --cors-origins, or --api-key after it
#   ${sd-server}         the same for a specialist's sd-server; don't add
#                        -l, --listen-ip, or --listen-port after it
#   ${models-dir}        MODELS_DIR
#   ${proxy}             where llama-swap reaches a generalist; each one
#                        needs "proxy: ${proxy}"
#   ${specialist-proxy}  the same for a specialist; each one needs
#                        "proxy: ${specialist-proxy}"
# Don't give a model its own "macros:" (they'd override these).
# manage-models.sh and install-models.sh check these rules, and
# install-models.sh checks that llama-swap accepts the result.
#
# Each text model also needs capabilities.context (its context window,
# which must match --ctx-size) and metadata.max_tokens (the most tokens
# one reply may use); infer-models reads both from the engine, for pi.
# A specialist instead needs capabilities.out: [image], which keeps it
# out of pi's list, and a ttl (seconds without a request before it
# unloads) of at most 3600.
# One generalist has metadata.default: true; it's nopi's default
# (./manage-models.sh default NAME changes it).
#
# Sampling: llama-server uses the sampling settings a GGUF file
# recommends (its general.sampling.* metadata) when it has them. Our
# defaults below come from each model card. A key ending in "?" is a
# default: llama-swap sets it only when a request doesn't, so a client
# can still choose its own. setParamsByID also creates a variant under
# another name (an alias) that shares the loaded model, so switching
# between them doesn't reload anything. llama-swap applies setParams
# and then setParamsByID, and a "?" key is skipped once either has set
# it, so a model with variants keeps each variant's defaults in
# setParamsByID, not setParams.
models:
  qwen3.8-27b:
    # file: qwen3.8-27b/mmproj-F16.gguf cbb841a9ee0636b2ec172f5bb8df2ea8dfeb01e90fe7c6126581d662a0b4e43e apache-2.0 https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/mmproj-F16.gguf
    # file: qwen3.8-27b/mtp-Qwen3.8-27B-Q4_0.gguf 50d9ce5a6da381bbcfb31061cf73df94a90e6faf8efeddee379a9cb8f1501c6e apache-2.0 https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
    # file: Qwen3.8-27B-Q8_0.gguf a680f44a06920e5d689774823782006aa3acc8db95750323373b24139b67e348 apache-2.0 https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-Q8_0.gguf
    name: "Qwen3.8-27B Q8_0"
    # --reasoning-budget caps thinking at 32768 tokens, then makes the
    # model answer, unless a request sets its own budget
    # (thinking_budget_tokens; pi does, for each thinking level). Without
    # it, thinking may run until max_tokens, leaving no answer at all.
    # Qwen evaluated its coding with up to 32768 tokens per turn, and the
    # chat template tells the model to think at "xhigh" effort unless a
    # request says otherwise, so a smaller cap would cut it off
    # mid-plan. When the budget runs out,
    # llama-server inserts --reasoning-budget-message (the sentence Qwen
    # suggests for this) before ending the thinking, so the model answers
    # from what it's worked out instead of stopping mid-thought.
    # --mmproj loads its vision projector (about 0.9 GB), so it can read
    # images; capabilities.in says so, so pi sends them. Many models'
    # projector files share this name, so it's in its own directory.
    # --spec-draft-model with --spec-type draft-mtp enables speculative
    # decoding with the model's own trained MTP module (the repo's
    # mtp-Qwen3.8-27B-Q4_0.gguf): it drafts a few tokens that the main
    # model verifies in one pass, speeding token generation, which is
    # where long thinking spends its time. The cost is ~1.3 GB of module
    # weights plus a small draft KV cache (~4 KiB/token), fine on this
    # 128 GB Mac. If a llama.cpp upgrade changes the flags, or acceptance
    # turns out poor, drop them. ngram-mod also drafts by copying: when
    # the last 24 tokens match earlier text in the context, it proposes
    # what followed them there, which often hits when the model rewrites
    # code it's already seen. --spec-draft-n-max 4 drafts one more token
    # than the default 3 (acceptance was 59%, with a mean of 2.78 of 3).
    # Speculative decoding never changes the output, only its speed; one
    # report found MTP plus ngram-mod at 4 about 25-30% faster on agent
    # work than MTP alone.
    # --ubatch-size 2048 (default 512) processes prompts in bigger
    # chunks, which I expect speeds up prefill on Metal, at the cost of a
    # bigger compute buffer.
    # --image-min-tokens 1024 is what llama-server suggests for Qwen-VL
    # models' accuracy on images; small images then cost more tokens.
    cmd: ${llama-server} --model ${models-dir}/Qwen3.8-27B-Q8_0.gguf --mmproj ${models-dir}/qwen3.8-27b/mmproj-F16.gguf --spec-draft-model ${models-dir}/qwen3.8-27b/mtp-Qwen3.8-27B-Q4_0.gguf --spec-type ngram-mod,draft-mtp --spec-draft-n-max 4 --ctx-size 262144 --ubatch-size 2048 --image-min-tokens 1024 --reasoning-budget 32768 --reasoning-budget-message "Considering the limited time by the user, I have to give the solution based on the thinking directly now."
    proxy: ${proxy}
    capabilities:
      in: [text, image]
      out: [text]
      context: 262144
    metadata:
      # The card recommends up to 131072 for the final response on
      # agentic tasks; we use 65536, to limit rambles and loops. Thinking
      # and the answer share this ceiling, so it also bounds how large a
      # request's thinking budget may be: 32768 of thinking still leaves
      # 32768 for the answer.
      max_tokens: 65536
      default: true
    filters:
      # From the model card (unsloth/Qwen3.8-27B-GGUF). Its GGUF files
      # set only temperature, top_p, and top_k, so llama-server would
      # otherwise use its own min_p of 0.05.
      setParamsByID:
        "${MODEL_ID}":
          temperature?: 1.0
          top_p?: 0.95
          top_k?: 20
          min_p?: 0
          # presence_penalty, left at the card's thinking-mode value of
          # 0: it subtracts a flat amount from the logit of every token
          # that appears anywhere in the context already (once, unlike
          # frequency_penalty, which scales with the count). The card
          # offers it (0-2) to suppress endless repetition, a real
          # agentic failure mode, but a long coding conversation contains
          # every identifier the code reuses, so a nonzero value taxes
          # that legitimate reuse, and the card warns higher values can
          # cause language mixing and a slight quality drop. Revisit if
          # repetition loops show up.
          presence_penalty?: 0
          repeat_penalty?: 1.0
        # Without thinking: the card's "instruct (or non-thinking) mode".
        "${MODEL_ID}:instruct":
          temperature?: 0.7
          top_p?: 0.8
          top_k?: 20
          min_p?: 0
          presence_penalty?: 1.5
          repeat_penalty?: 1.0
          chat_template_kwargs:
            enable_thinking: false
  flux2-klein-4b:
    # file: flux2-klein-4b/flux-2-klein-4b-Q8_0.gguf 0bba6951258ec8f92d51114a8fa13e66828297bfff58a738f52729b3ef66fa28 apache-2.0 https://huggingface.co/leejet/FLUX.2-klein-4B-GGUF/resolve/main/flux-2-klein-4b-Q8_0.gguf
    # file: flux2-klein-4b/Qwen3-4B-Q8_0.gguf eed555233267a33c7e8ee31682762cc7751b3f6d224039086e0e846f05fffa5d apache-2.0 https://huggingface.co/unsloth/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q8_0.gguf
    # file: flux2-klein-4b/diffusion_pytorch_model.safetensors ca70d2202afe6415bdbcb8793ba8cd99fd159cfe6192381504d6c4d3036e0f04 apache-2.0 https://huggingface.co/black-forest-labs/FLUX.2-klein-4B/resolve/main/vae/diffusion_pytorch_model.safetensors
    name: "FLUX.2-klein 4B Q8_0 (images)"
    # For /v1/images/generations and /sdapi/v1/txt2img. --cfg-scale 1.0
    # --steps 4 are what stable-diffusion.cpp's docs/flux2.md uses for it.
    # sd-server has no /health, llama-swap's default checkEndpoint. It
    # loads the model before it listens, so /v1/models answers only once
    # the model is ready.
    cmd: ${sd-server} --diffusion-model ${models-dir}/flux2-klein-4b/flux-2-klein-4b-Q8_0.gguf --vae ${models-dir}/flux2-klein-4b/diffusion_pytorch_model.safetensors --llm ${models-dir}/flux2-klein-4b/Qwen3-4B-Q8_0.gguf --cfg-scale 1.0 --steps 4
    proxy: ${specialist-proxy}
    # Unload after 10 minutes without a request: long enough to look at an
    # image and ask for another, and it frees its memory (and closes its
    # unauthenticated port) soon after.
    ttl: 600
    checkEndpoint: /v1/models
    capabilities:
      in: [text]
      out: [image]
  qwen3-0.6b:
    # file: Qwen3-0.6B-Q4_0.gguf da2572f16c06133561ce56accaa822216f2391ef4d37fba427801cd6736417d4 apache-2.0 https://huggingface.co/ggml-org/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_0.gguf
    name: "Qwen3-0.6B Q4_0 (tests)"
    cmd: ${llama-server} --model ${models-dir}/Qwen3-0.6B-Q4_0.gguf --ctx-size 32768
    proxy: ${proxy}
    capabilities:
      context: 32768
    metadata:
      max_tokens: 4096
    filters:
      # From the model card (Qwen/Qwen3-0.6B), for thinking mode.
      setParams:
        temperature?: 0.6
        top_p?: 0.95
        top_k?: 20
        min_p?: 0
